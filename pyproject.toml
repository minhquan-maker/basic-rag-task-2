[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkg"
version = "0.1.0"
description = "Vector RAG và KG-RAG cơ bản, cài đặt trực tiếp trên ChromaDB, NetworkX và Gemini"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2",
    "chromadb>=1.0",
    "networkx>=3.2",
    "pyvis>=0.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ragkg = "ragkg.cli:main"

[tool.setuptools.packages.find]
include = ["ragkg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
